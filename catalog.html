<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — HNS</title>
  <link rel="stylesheet" href="styles.css?v=20261113">
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">H<span class="logo__dot">N</span>S</a>

      <form class="search" id="searchForm">
        <svg class="search__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" class="search__input" id="searchInput" placeholder="Поиск: смартфоны, ноутбуки, техника...">
      </form>

      <div class="header__actions">
        <button class="icon-btn" id="favBtn" title="Избранное">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          <span class="badge" id="favCount" hidden>0</span>
        </button>
        <button class="icon-btn icon-btn--cart" id="cartBtn" title="Корзина">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
          <span class="badge" id="cartCount" hidden>0</span>
        </button>
        <a href="profile.html" class="btn btn--auth" id="authBtn" title="Войти">Войти</a>
      </div>
    </div>
  </header>

  <!-- Хлебные крошки -->
  <nav class="crumb">
    <div class="container">
      <a href="index.html">Главная</a>
      <span>/</span>
      <span>Каталог</span>
    </div>
  </nav>

  <!-- Каталог -->
  <section class="catalog">
    <div class="container">
      <div class="section-head">
        <h2 class="section-title" id="catalogTitle">Каталог товаров</h2>
        <div class="filters" id="filters">
          <button class="chip chip--active" data-filter="all">Все</button>
          <button class="chip" data-filter="smartphones">Смартфоны</button>
          <button class="chip" data-filter="laptops">Ноутбуки</button>
          <button class="chip" data-filter="audio">Аудио</button>
          <button class="chip" data-filter="appliances">Техника</button>
        </div>
      </div>

      <div class="products" id="products"></div>
      <p class="empty" id="empty" hidden>По вашему запросу ничего не найдено.</p>
    </div>
  </section>

  <!-- Панели -->
  <div class="overlay" id="overlay" hidden></div>

  <aside class="panel" id="favoritesPanel" aria-hidden="true">
    <div class="panel__head">
      <h3>Избранное</h3>
      <button class="panel__close" data-close="favoritesPanel">×</button>
    </div>
    <div class="panel__body" id="favoritesList"></div>
  </aside>

  <aside class="panel" id="cartPanel" aria-hidden="true">
    <div class="panel__head">
      <h3>Корзина</h3>
      <button class="panel__close" data-close="cartPanel">×</button>
    </div>
    <div class="panel__body" id="cartList"></div>
    <div class="panel__foot">
      <div class="panel__total">Итого: <strong id="cartTotal">0 ₽</strong></div>
      <button class="btn btn--primary panel__checkout" id="checkoutBtn">Оформить заказ</button>
    </div>
  </aside>

  <!-- Подвал -->
  <footer class="footer">
    <div class="container footer__inner">
      <div>
        <a href="#" class="logo">H<span class="logo__dot">N</span>S</a>
        <p class="footer__note">© 2026 HNS. Все права защищены.</p>
      </div>
      <ul class="footer__links">
        <li><a href="#">Доставка и оплата</a></li>
        <li><a href="#">Гарантия</a></li>
        <li><a href="#">Контакты</a></li>
      </ul>
    </div>
  </footer>

  <!-- Уведомление -->
  <div class="toast" id="toast" hidden></div>

  <script src="products-data.js"></script>
  <script src="catalog.js"></script>
</body>
</html>
